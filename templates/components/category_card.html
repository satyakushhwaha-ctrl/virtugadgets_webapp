<article class="rounded-2xl border border-blue-100 bg-white p-6 shadow-sm transition hover:-translate-y-0.5 hover:shadow-md">
  <div class="flex h-12 w-12 items-center justify-center rounded-xl bg-blue-50 text-blue-700">
    <span class="text-lg font-extrabold">{{ initial }}</span>
  </div>
  <h3 class="mt-5 text-lg font-bold text-slate-950">{{ title }}</h3>
  <p class="mt-2 text-sm leading-6 text-slate-600">{{ description }}</p>
</article>
